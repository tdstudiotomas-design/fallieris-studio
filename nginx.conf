server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # Cabeceras de seguridad
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                  # nadie te mete en un iframe
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content-Security-Policy: solo se puede cargar código desde estos lugares.
    # 'unsafe-eval' es necesario porque Babel standalone compila el JSX en el navegador.
    # 'unsafe-inline' en style-src es por los estilos inline de los componentes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # El panel no se indexa
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # El service worker nunca se cachea: si no, el navegador queda pegado
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # HTML siempre fresco
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Estáticos con caché corta (config.js queda afuera a propósito)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /js/config.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
